services:
  bot_db:
    image: postgres:16-alpine3.18
    environment:
      POSTGRES_DB: tvgo_db
      POSTGRES_USER: mirodil
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres_tvgo:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5434:5432"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirodil -d tvgo_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    secrets:
      - postgres_password

  python_bot:
    build:
      context: ./mjtvbot
    ports:
      - "8082:8082"
    depends_on:
      bot_db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mirodil:${POSTGRES_PASSWORD}@bot_db:5432/tvgo_db?sslmode=disable
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - default
    secrets:
      - postgres_password

  go_tvgo:
    build:
      context: ./tvgo
      args:
        CI_JOB_LOGIN: ${CI_JOB_LOGIN}
        CI_JOB_TOKEN: ${CI_JOB_TOKEN}
    ports:
      - "8083:8083"
    depends_on:
      bot_db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mirodil:${POSTGRES_PASSWORD}@bot_db:5432/tvgo_db?sslmode=disable
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - default
    secrets:
      - postgres_password

volumes:
  postgres_tvgo:

networks:
  default:

secrets:
  postgres_password:
    environment: POSTGRES_PASSWORD